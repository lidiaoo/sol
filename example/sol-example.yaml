# 纯包 -> 关机；magic+"reboot" -> 重启；magic+"sleep" -> 睡眠
version: 1
server:
  interfaces: []
  # 改这份文件后秒级自动生效（改坏了也不会顶掉正在跑的那份）。
  watch: 5s
  # HTTP 控制面（默认开启）：令牌三选一——token 就直接写在下面、token_env 指环境变量、token_file 指
  # 一个 0600 文件。三端的设置办法与 curl 用法见 README 的 Control plane 一节；不要控制面就把
  # enabled 改成 false。
  http:
    enabled: true
    listen: 127.0.0.1:8080
    # 令牌只准写一个，多写会被拒绝。安装脚本生成的配置用的是第一种：它随机生成一串填在这里，
    # 文件权限 0600（Windows 上只留 SYSTEM 与 Administrators）。下面这行是占位符，手写时换成自己的。
    auth: { type: bearer, token: "<一段长随机串>" }
    # auth: { type: bearer, token_env: SOL_TOKEN }        # 环境变量的名字，不是令牌本身
    # auth: { type: bearer, token_file: /etc/sol/token }  # 0600 文件
rules:
  - match: { ports: [11], content: { kind: none } }
    action: power.shutdown
  - match: { ports: [12], content: { kind: none } }
    action: power.reboot
  - match: { ports: [10], content: { kind: none } }
    action: power.sleep
security:
  # 默认就有的重复包保护：电源动作各带 5s 冷却，且刚开机 / 刚唤醒 5s 内不执行电源动作。
  # 想关掉就把 settle 写 0、把对应动作写 0s。这里显式写出来只为一眼看得见默认值。
  settle: 5s
  cooldowns: { power.sleep: 5s, power.shutdown: 5s, power.reboot: 5s }
