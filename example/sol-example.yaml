# 纯包 -> 关机；magic+"reboot" -> 重启；magic+"sleep" -> 睡眠
version: 1
server:
  interfaces: []
rules:
  - match: { ports: [11], content: { kind: none } }
    action: power.shutdown
  - match: { ports: [12], content: { kind: none } }
    action: power.reboot
  - match: { ports: [10], content: { kind: none } }
    action: power.sleep
security:
  # 默认就有的重复包保护：电源动作各带 2m 冷却，且刚开机 / 刚唤醒 2m 内不执行电源动作。
  # 想关掉就把 settle 写 0、把对应动作写 0s。这里显式写出来只为一眼看得见默认值。
  settle: 2m
  cooldowns: { power.sleep: 2m, power.shutdown: 2m, power.reboot: 2m }
