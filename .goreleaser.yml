version: 2

# 三平台六架构：这是 fork（github.com/lidiaoo/sol），不再依赖上游 org 的复用工作流，
# 免得 releases 里没有 darwin/windows 产物——那是"装完跑不起来"最直接的原因。
builds:
  - id: sol
    main: .
    binary: sol
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/lidiaoo/sol/internal/buildinfo.version={{ .Version }}
      # CI builds from a tag checkout, which is clean by definition (tracked changes only). Stamp it,
      # or the revision would report "-dirty": the toolchain counts untracked files, and goreleaser
      # writes into dist/ while building.
      - -X github.com/lidiaoo/sol/internal/buildinfo.dirty=false

# 安装配置模板三个平台各一份、各自维护；安装脚本只读自己那平台的 install-<平台>.yaml。
#
# 说明：goreleaser 的 archives[].files 不能按 goos 过滤（Archive 结构体没有 goos 字段，File 也没有
# 条件字段），所以这边把三份都打进每个包，各自的文件名不冲突，脚本只取自己那份——多带两份模板
# 几 KB，比按平台拆 archive 再靠 goos 过滤可靠。真正"各平台各带一份"的构建走 scripts/release.sh，
# 那里有 goos 变量，按平台只拷一份。
archives:
  - id: sol
    formats: [tar.gz]
    # 名字必须与 scripts/release.sh 和 README 里的下载链接一致：sol-v0.1.0-linux-amd64.tar.gz。
    # （不设 name_template 时 goreleaser 默认用下划线，README 那些地址会 404——和当初 install.sh 一样。）
    name_template: '{{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}'
    # 包里要有 README 和安装脚本：解包出来的目录就是"执行目录"，零参数跑 install.sh/install.cmd 就能装。
    files:
      - README.md
      - README.en.md
      - CHANGELOG.md
      - LICENSE
      - scripts/install.sh
      - scripts/install.ps1
      - scripts/install.cmd
      # 三个平台的安装配置模板（脚本按 OS 取自己那份）
      - scripts/install-linux.yaml
      - scripts/install-macos.yaml
      - scripts/install-windows.yaml
      # 运行配置模板（~/sol/sol.yaml）：包里带上，脚本直接拿它生成。
      - scripts/sol.yaml
      - example/sol-example.yaml
      - schema/sol.schema.json
      # 技能目录（Hermes 的 sol-install）：README 指向它，包里也带上，跟本地脚本保持一致
      - skills/**
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt

changelog:
  use: github